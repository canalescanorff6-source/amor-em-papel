name: Bootstrap V2 source

on:
  push:
    branches:
      - feat/v2-paperly-premium
    paths:
      - .github/workflows/bootstrap-v2.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2-paperly-premium

      - name: Download V2 source archive
        run: |
          curl --fail --location 'https://cc15df9d-8da5-47e1-a2b0-13099029a1ab.sandbox.floot.app/_cdn/static/c0e1aff9-b5c1-4ce8-be7c-8b1345e240df-amor-em-papel-v2-premium-source.zip' --output /tmp/amor-v2.zip
          test "$(stat -c%s /tmp/amor-v2.zip)" -eq 273810

      - name: Replace branch with reviewed V2 source
        run: |
          rm -rf .bootstrap
          unzip -oq /tmp/amor-v2.zip -d .
          rm -f .github/workflows/bootstrap-v2.yml

      - name: Commit V2 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import Amor em Papel V2 premium'
          git push origin HEAD:feat/v2-paperly-premium
